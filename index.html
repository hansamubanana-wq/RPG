<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Twilight Throne - 黄昏の王座 -</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        
        body {
            background-color: #111;
            color: #fff;
            font-family: 'DotGothic16', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            image-rendering: pixelated;
            user-select: none;
        }

        #game-container {
            width: 600px;
            background-color: #000;
            border: 4px solid #fff;
            padding: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        h1, h2, h3 {
            text-align: center;
            color: #ffd700;
            margin-top: 0;
            text-shadow: 2px 2px #000;
        }

        .screen { display: none; }
        .active { display: block; }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 5px;
            border-bottom: 1px dashed #333;
        }

        button {
            background-color: #222;
            color: #fff;
            border: 2px solid #fff;
            font-family: 'DotGothic16', sans-serif;
            padding: 5px 15px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover:not(:disabled) {
            background-color: #ffd700;
            color: #000;
        }

        button:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
            background-color: #111;
        }

        .battle-view {
            display: flex;
            justify-content: space-between;
            height: 150px;
            border: 2px solid #333;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(to bottom, #111, #222);
        }

        .char-box {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hp-bar-container {
            width: 100%;
            background-color: #555;
            border: 1px solid #fff;
            height: 12px;
            margin-top: 5px;
        }

        .hp-bar { background-color: #ff4757; height: 100%; width: 100%; transition: width 0.3s; }
        .mp-bar { background-color: #1e90ff; height: 100%; width: 100%; transition: width 0.3s; }

        .battle-log {
            height: 110px;
            border: 2px solid #fff;
            padding: 10px;
            overflow-y: auto;
            background-color: #111;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .commands {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .weapon-select {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .pixel-art { font-size: 40px; margin-bottom: 5px; }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            background-color: #222;
            padding: 8px;
            border: 2px solid #555;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* チュートリアル用の会話ウィンドウ */
        .dialogue-box {
            border: 3px solid #fff;
            padding: 15px;
            background-color: #111;
            min-height: 80px;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>TWILIGHT THRONE</h1>
    
    <div id="top-status-bar" class="player-header" style="display: none;">
        <div>称号: <span id="header-title">新米の旅人</span></div>
        <div>Lv: <span id="header-lv">1</span></div>
        <div>Exp: <span id="header-exp">0</span> / <span id="header-next">20</span></div>
    </div>
    
    <div id="intro-screen" class="screen active">
        <h2>- 旅立ちの刻 -</h2>
        <div style="text-align: center; font-size: 60px; margin: 20px 0;">🧙‍♂️</div>
        <div class="dialogue-box">
            <strong style="color: #ffd700;">【主人公】</strong><br>
            <span id="intro-text">……ううむ、ここは一体どこだ？ 確か神の遺物を探して霧の彼方へ進んでいたはずだが……。</span>
        </div>
        <div style="text-align: right;">
            <button id="intro-next-btn" onclick="nextIntro()">次へ ➔</button>
        </div>
    </div>

    <div id="build-screen" class="screen">
        <h2>拠点：霧に隠された聖域</h2>
        <div class="dialogue-box" style="min-height: 40px; margin-bottom: 10px; border-color: #ffd700;">
            <strong style="color: #ffd700;">【主人公】</strong><br>
            <span id="hero-lobby-comment">よし、次の戦いに向けて能力を調整するか。武器によって得意なステータスが違うからな。</span>
        </div>

        <div class="weapon-select">
            <button onclick="selectWeapon('大剣')">⚔️大剣</button>
            <button onclick="selectWeapon('名刀')">🗡️名刀</button>
            <button onclick="selectWeapon('聖杖')">🪄聖杖</button>
        </div>
        <p style="text-align: center; color: #aaa; margin: 5px 0;">装備中: <strong id="selected-wep" style="color:#fff;">大剣</strong></p>
        
        <div id="status-builders"></div>
        
        <h3 style="color:#ffd700; margin-top:15px; font-size:18px;">── 進行中のステージ ──</h3>
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="btn-next-stage" onclick="startCurrentStage()" style="padding: 10px 20px; font-size: 18px; border-color: #ff4757; color: #ff4757; width: 100%;">
                第<span id="lobby-stage-num">1</span>章：<span id="lobby-stage-name">???</span> に挑む
            </button>
        </div>

        <h3 style="color:#1e90ff; margin-top:15px; font-size:18px;">── オンライン対人戦 ──</h3>
        <div style="text-align: center;">
            <button id="btn-pvp" onclick="alert('全ボス撃破おめでとう！いよいよFirebase通信による対人戦の組み込みだね！')" style="width: 100%; border-color: #1e90ff; color: #1e90ff;" disabled>⚔️ ランクマッチ（全ボス撃破で解放）</button>
        </div>
    </div>

    <div id="battle-screen" class="screen">
        <h2 id="enemy-title">宿敵</h2>
        
        <div class="battle-view">
            <div class="char-box">
                <div class="pixel-art">🧙‍♂️</div>
                <div>主人公</div>
                <div class="hp-bar-container"><div id="p-hp" class="hp-bar"></div></div>
                <div class="hp-bar-container" style="margin-top:2px;"><div id="p-mp" class="mp-bar"></div></div>
                <div style="font-size: 12px; margin-top: 3px;">HP: <span id="p-hp-text"></span> | MP: <span id="p-mp-text"></span></div>
            </div>
            <div class="char-box">
                <div id="enemy-icon" class="pixel-art">👹</div>
                <div id="enemy-name">敵</div>
                <div class="hp-bar-container"><div id="e-hp" class="hp-bar"></div></div>
                <div style="font-size: 12px; margin-top: 3px;">HP: <span id="e-hp-text"></span></div>
            </div>
        </div>

        <div id="battle-hero-box" class="dialogue-box" style="min-height: 40px; margin-bottom: 10px; font-size: 14px; display:none;">
            <strong style="color: #ffd700;">【主人公】</strong> <span id="battle-hero-text"></span>
        </div>

        <div id="log" class="battle-log"></div>

        <div class="commands">
            <button onclick="playerAction('attack')">通常攻撃</button>
            <button id="skill-btn" onclick="playerAction('skill')">固有戦技 (MP 10)</button>
            <button id="heal-btn" onclick="playerAction('heal')">聖杯瓶 (残3)</button>
            <button id="back-btn" onclick="goToBuild()">撤退する</button>
        </div>
    </div>
</div>

<script>
    // プレイヤーデータ
    let player = {
        level: 1, exp: 0, nextExp: 20, title: "果てなき旅人",
        stats: { 生命力: 10, 精神力: 10, 筋力: 10, 技量: 10, 信仰: 10 },
        baseStats: { 生命力: 10, 精神力: 10, 筋力: 10, 技量: 10, 信仰: 10 },
        weapon: '大剣', hp: 100, maxHp: 100, mp: 20, maxMp: 20, potions: 3,
        currentStage: 0
    };

    // 隠された全10ステージの敵データ（後ろに行くほど凶悪に）
    const stages = [
        { name: "辺境の浮浪兵", icon: "🛡️", hp: 60, maxHp: 60, atk: 6, expReward: 20 },
        { name: "遺跡の猟犬", icon: "🐕", hp: 110, maxHp: 110, atk: 10, expReward: 25 },
        { name: "忌み子・マルギト", icon: "👹", hp: 180, maxHp: 180, atk: 15, expReward: 40 },
        { name: "魔術学院の生徒", icon: "🧙", hp: 220, maxHp: 220, atk: 18, expReward: 50 },
        { name: "満月の女王・レナラ", icon: "🔮", hp: 350, maxHp: 350, atk: 24, expReward: 90 },
        { name: "火を盗んだ巨人", icon: "🌋", hp: 450, maxHp: 450, atk: 28, expReward: 120 },
        { name: "死王子の残滓", icon: "💀", hp: 520, maxHp: 520, atk: 32, expReward: 160 },
        { name: "黄金の君主・ゴドリック", icon: "👑", hp: 680, maxHp: 680, atk: 38, expReward: 250 },
        { name: "古竜の末裔", icon: "🐉", hp: 850, maxHp: 850, atk: 45, expReward: 400 },
        { name: "黄昏の残影（神の抜け殻）", icon: "✨", hp: 1200, maxHp: 1200, atk: 55, expReward: 999 }
    ];

    let currentEnemy = {};
    let availablePoints = 5;
    const statNames = ['生命力', '精神力', '筋力', '技量', '信仰'];

    // チュートリアルの進行管理
    let introStep = 0;
    const introDialogues = [
        "……ううむ、ここは一体どこだ？ 確か神の遺物を探して霧の彼方へ進んでいたはずだが……。",
        "おや？画面の上に『Lv』とか『Exp』とかいう奇妙な文字が見えるな。なるほど……私はゲームの世界に囚われたらしい。ならばルールに従うまで！",
        "私は【大剣】【名刀】【聖杖】を切り替えて戦える。大剣なら『筋力』、名刀なら『技量』、聖杖なら『信仰』を高めると攻撃の威力が上がる仕組みのようだ。",
        "『生命力』を上げれば最大HPが大きく増え、『精神力』を上げれば大技を放つためのMPが増えるな。レベルが上がるたびにポイントを5得られるらしい、どう育てるか……。",
        "そして、この世界には10の試練（ステージ）があり、1体を倒すごとに次の強敵の姿が霧の向こうから現れる仕様のようだ。よし、まずは最初の敵をぶっ飛ばしにいくか！"
    ];

    function nextIntro() {
        introStep++;
        if (introStep < introDialogues.length) {
            document.getElementById('intro-text').innerText = introDialogues[introStep];
        } else {
            // チュートリアル終了、拠点へ
            document.getElementById('intro-screen').classList.remove('active');
            document.getElementById('build-screen').classList.add('active');
            document.getElementById('top-status-bar').style.display = 'flex';
            initBuildScreen();
        }
    }

    function initBuildScreen() {
        const container = document.getElementById('status-builders');
        container.innerHTML = '';
        statNames.forEach(stat => {
            container.innerHTML += `
                <div class="status-row">
                    <span>${stat}: <strong id="val-${stat}">${player.stats[stat]}</strong></span>
                    <div>
                        <button onclick="adjustStat('${stat}', -1)">-</button>
                        <button onclick="adjustStat('${stat}', 1)">+</button>
                    </div>
                </div>
            `;
        });
        
        // ランダムな拠点でのセリフ
        const lobbyComments = [
            "ふぅ、ここが安全地帯か。次はどんな奴が待っているのやら……。",
            "ステータスを尖らせるか、平均的に振るか、悩むな……。",
            "聖杯瓶の残量よし。武器のキレよし。いつでもいけるぞ。"
        ];
        document.getElementById('hero-lobby-comment').innerText = lobbyComments[Math.floor(Math.random() * lobbyComments.length)];

        updateHeaderUI();
        updateBuildUI();
    }

    function adjustStat(stat, amount) {
        if (amount > 0 && availablePoints > 0) {
            player.stats[stat]++; availablePoints--;
        } else if (amount < 0 && player.stats[stat] > player.baseStats[stat]) {
            player.stats[stat]--; availablePoints++;
        }
        updateBuildUI();
    }

    function selectWeapon(wep) {
        player.weapon = wep;
        document.getElementById('selected-wep').innerText = wep;
        const skillBtn = document.getElementById('skill-btn');
        if(wep === '大剣') skillBtn.innerText = "巨剣の一撃 (筋力)";
        if(wep === '名刀') skillBtn.innerText = "居合・抜刀 (技量)";
        if(wep === '聖杖') skillBtn.innerText = "黄金の怒り (信仰)";
    }

    function updateBuildUI() {
        document.getElementById('points').innerText = availablePoints;
        statNames.forEach(stat => {
            document.getElementById(`val-${stat}`).innerText = player.stats[stat];
        });
        
        if (player.currentStage < stages.length) {
            document.getElementById('lobby-stage-num').innerText = player.currentStage + 1;
            document.getElementById('lobby-stage-name').innerText = stages[player.currentStage].name;
        } else {
            // 全クリア時
            document.getElementById('btn-next-stage').innerText = "✨ 全ステージ完全踏破！ ✨";
            document.getElementById('btn-next-stage').disabled = true;
            document.getElementById('btn-pvp').removeAttribute('disabled');
            player.title = "エルデの絶対王";
        }
        updateHeaderUI();
    }

    function updateHeaderUI() {
        document.getElementById('header-title').innerText = player.title;
        document.getElementById('header-lv').innerText = player.level;
        document.getElementById('header-exp').innerText = player.exp;
        document.getElementById('header-next').innerText = player.nextExp;
    }

    // 現在のステージに突入
    function startCurrentStage() {
        if (player.currentStage >= stages.length) return;
        
        currentEnemy = { ...stages[player.currentStage] };

        player.maxHp = player.stats['生命力'] * 12; player.hp = player.maxHp;
        player.maxMp = player.stats['精神力'] * 3; player.mp = player.maxMp;
        player.potions = 3;

        document.getElementById('enemy-title').innerText = `第${player.currentStage + 1}章：${currentEnemy.name}`;
        document.getElementById('enemy-name').innerText = currentEnemy.name;
        document.getElementById('enemy-icon').innerText = currentEnemy.icon;

        document.getElementById('build-screen').classList.remove('active');
        document.getElementById('battle-screen').classList.add('active');
        document.getElementById('back-btn').innerText = "撤退する";
        document.getElementById('battle-hero-box').style.display = "block";
        
        // 開幕時の主人公のセリフ
        document.getElementById('battle-hero-text').innerText = `出たな、${currentEnemy.name}！ 私のビルドの錆びにしてくれるわ！`;

        const log = document.getElementById('log');
        log.innerHTML = `<p style="color: #ffd700;">${currentEnemy.name}との決戦が始まった！</p>`;
        updateBattleUI();
    }

    function updateBattleUI() {
        document.getElementById('p-hp').style.width = (player.hp / player.maxHp * 100) + '%';
        document.getElementById('p-mp').style.width = (player.mp / player.maxMp * 100) + '%';
        document.getElementById('e-hp').style.width = (currentEnemy.hp / currentEnemy.maxHp * 100) + '%';
        
        document.getElementById('p-hp-text').innerText = `${player.hp}/${player.maxHp}`;
        document.getElementById('p-mp-text').innerText = `${player.mp}/${player.maxMp}`;
        document.getElementById('e-hp-text').innerText = `${currentEnemy.hp}/${currentEnemy.maxHp}`;
        document.getElementById('heal-btn').innerText = `聖杯瓶 (残${player.potions})`;
    }

    function addLog(text, color = '#fff') {
        const log = document.getElementById('log');
        log.innerHTML += `<p style="color: ${color};">${text}</p>`;
        log.scrollTop = log.scrollHeight;
    }

    function playerAction(type) {
        if (player.hp <= 0 || currentEnemy.hp <= 0) return;

        let dmg = 0;
        if (type === 'attack') {
            dmg = Math.floor(5 + Math.max(player.stats['筋力'], player.stats['技量']) * 0.5);
            currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);
            addLog(`⚔️ あなたの攻撃！ ${currentEnemy.name}に ${dmg} のダメージ！`);
            document.getElementById('battle-hero-text').innerText = `ふん、手応えあり！ 基本の構えからの一撃だ！`;
        } 
        else if (type === 'skill') {
            if (player.mp < 10) { 
                addLog(`❌ MP不足！`, '#ff4757'); 
                document.getElementById('battle-hero-text').innerText = `おっと、MPが足りない！？大技を焦りすぎたか……！`;
                return; 
            }
            player.mp -= 10;
            
            if (player.weapon === '大剣') {
                dmg = Math.floor(player.stats['筋力'] * 2.5);
                document.getElementById('battle-hero-text').innerText = `我が筋力を見よ！【巨剣の一撃】を喰らえ！！`;
            } else if (player.weapon === '名刀') {
                dmg = Math.floor(player.stats['技量'] * 2.2 * (Math.random() > 0.5 ? 1.5 : 1));
                document.getElementById('battle-hero-text').innerText = `見切れまい！【居合・抜刀】、一閃！！`;
            } else if (player.weapon === '聖杖') {
                dmg = Math.floor(player.stats['信仰'] * 2.8);
                document.getElementById('battle-hero-text').innerText = `神の怒りをここに宿す！【黄金の怒り】！！`;
            }
            
            currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);
            addLog(`💥 戦技を発動！ ${currentEnemy.name}に ${dmg} の大ダメージ！`, '#ffd700');
        } 
        else if (type === 'heal') {
            if (player.potions <= 0) { 
                addLog(`❌ 聖杯瓶が空だ！`, '#ff4757'); 
                document.getElementById('battle-hero-text').innerText = `くっ、聖杯瓶がもうない！ここからは気合いの勝負か……！`;
                return; 
            }
            player.potions--;
            let healAmount = Math.floor(player.maxHp * 0.5 + player.stats['信仰'] * 0.5);
            player.hp = Math.min(player.maxHp, player.hp + healAmount);
            addLog(`🧪 聖杯瓶を使用。 HPが ${healAmount} 回復。`, '#2ed573');
            document.getElementById('battle-hero-text').innerText = `ぷはぁ、生き返る！やはりこの黄金の水に限るな！`;
        }

        updateBattleUI();

        if (currentEnemy.hp <= 0) { winBattle(); return; }
        setTimeout(enemyTurn, 800);
    }

    function enemyTurn() {
        if (player.hp <= 0) return;

        let dmg = currentEnemy.atk;
        if (Math.random() > 0.7) {
            dmg = Math.floor(currentEnemy.atk * 1.5);
            addLog(`💥 ${currentEnemy.name}の痛烈な一撃！ あなたは ${dmg} のダメージ！`, '#ff4757');
            document.getElementById('battle-hero-text').innerText = `ぐあああっ！ こいつ、なかなか重い一撃を放ちやがる……！`;
        } else {
            addLog(`👹 ${currentEnemy.name}の攻撃。 あなたは ${dmg} のダメージ。`);
            document.getElementById('battle-hero-text').innerText = `チッ、かすり傷だ。これくらい耐えてみせるさ！`;
        }

        player.hp = Math.max(0, player.hp - dmg);
        updateBattleUI();

        if (player.hp <= 0) {
            addLog(`💀 YOU DIED`, '#ff4757');
            document.getElementById('battle-hero-text').innerText = `馬鹿な……私がここで倒れるだと？……いや、拠点でステータスを振り直して出直してやる！`;
            document.getElementById('back-btn').innerText = "拠点に戻る";
        }
    }

    function winBattle() {
        addLog(`🎉 ${currentEnemy.name}を討伐した！`, '#ffd700');
        addLog(`✨ 経験値を ${currentEnemy.expReward} 獲得！`, '#2ed573');
        document.getElementById('battle-hero-text').innerText = `勝ったぞ！フハハハ、私のビルドの前に敵などおらぬわ！さあ、経験値を糧にするぞ。`;
        
        player.currentStage++; // 次のステージへ進行
        player.exp += currentEnemy.expReward;

        while (player.exp >= player.nextExp) {
            player.exp -= player.nextExp;
            player.level++;
            availablePoints += 5;
            player.nextExp = Math.floor(player.nextExp * 1.6);
        }

        // 称号のアップデート
        if (player.currentStage >= 3) player.title = "名を馳せし宿将";
        if (player.currentStage >= 6) player.title = "デミゴッド討伐者";
        if (player.currentStage >= 9) player.title = "神殺しの英雄";

        player.baseStats = { ...player.stats };
        document.getElementById('back-btn').innerText = "拠点に戻る";
    }

    function goToBuild() {
        document.getElementById('battle-screen').classList.remove('active');
        document.getElementById('build-screen').classList.add('active');
        initBuildScreen();
    }
</script>

</body>
</html>
